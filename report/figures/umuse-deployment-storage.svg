<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="930" viewBox="0 0 1440 930" role="img" aria-labelledby="title desc">
<title id="title">uMuse deployment and storage</title>
<desc id="desc">Existing recordings and the local vault remain on the researcher's laptop. The browser communicates over HTTPS with a Railway container serving the interface and running Flask analysis. The container reads and writes a persistent volume holding hosted audio, the identity mapping, raw analysis and results. There is no automatic transfer from the existing local vault to Railway.</desc>
<rect width="1440" height="930" fill="white"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M3 1 L9 6 L3 11" fill="none" stroke="#687a72" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

